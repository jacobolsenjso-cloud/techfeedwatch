name: YouTube Auto Update

# GENSTARTET 21. august 2026 efter fuld remediering:
# - Alle 386 artikler omskrevet: emnet er artiklen, videoen er krediteret kilde.
# - Søgespørgsmål fra autocomplete er artiklens opgave (targetQuestion).
# - Titler varieret (8 former, publikations-casing, åbningsords-værn).
# - Dagsloft varierer med datoen: hverdage 2-6, weekend 1-3 — loft, ikke mål.
# - Kvalitetsværn: sprogtjek, min. varighed/kildetekst, tom-artikel-stop,
#   audit-content kører FØR commit og standser jobbet ved fejl.
#
# Stoppes igen: sæt # foran de to schedule-linjer nedenfor.

on:
  schedule:
    - cron: "0 */2 * * *" # Kører præcis hver anden time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      - name: Kør YouTube Robot
        run: node auto-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Kigger arkivet efter tomme artikler, manglende resuméer, manglende
      # kildeangivelse og spor fra modellen. Kører FØR commit, så en artikel
      # med et hul aldrig når at blive udgivet.
      #
      # Baggrund: 25 artikler blev udgivet helt uden brødtekst og lå der i tre
      # uger, fordi intet sagde fra. Scriptet afslutter med kode 1 ved fejl, og
      # så standser jobbet her i stedet for at pushe.
      - name: Tjek indholdet
        run: node audit-content.mjs

      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git commit -m "Automatisk tilføjet ny video"; then
            # Andre kan have pushet, mens robotten kørte (op til en time).
            # Målt 15/9: kørsel #522 skrev en artikel, men push blev afvist og
            # fejlen skjult af "|| echo" — artiklen gik tabt med et grønt flueben.
            # Nu: hent og læg vores commit ovenpå; fejler push alligevel, skal
            # kørslen blive RØD, så det bliver set.
            git pull --rebase origin main
            git push
          else
            echo "Ingen nye videoer fundet."
          fi
