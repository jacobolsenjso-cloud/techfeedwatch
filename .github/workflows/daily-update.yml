name: YouTube Auto Update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # RETTET TIL V4 (Fjerner exit code 128 fejl)
      - name: Setup Node.js
        uses: actions/setup-node@v4 # RETTET TIL V4 (Fjerner Node advarsler)
        with:
          node-version: '20' # Opdateret til nyeste version
      - name: Installer dependencies
        run: npm install
      - name: Kør YouTube Robot
        run: node auto-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # NY KODE TILFØJET: Robotten skal bruge din AI-nøgle for at køre add-video.mjs
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisk tilføjet ny video" && git push)
