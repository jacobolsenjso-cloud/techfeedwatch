name: YouTube Auto Update

# GENSTARTET 21. august 2026 efter fuld remediering:
# - Alle 386 artikler omskrevet: emnet er artiklen, videoen er krediteret kilde.
# - Søgespørgsmål fra autocomplete er artiklens opgave (targetQuestion).
# - Titler varieret (8 former, publikations-casing, åbningsords-værn).
# - Dagsloft (5/11-2026, techmediaarchs takt): 1-2 om dagen efter datoen, 0 tirsdag, fredag og søndag (UTC) — loft, ikke mål.
#   13/11-2026 (Jacob, pris): kun mandag, onsdag og fredag (UTC); 0 de andre dage.
# - Kvalitetsværn: sprogtjek, min. varighed/kildetekst, tom-artikel-stop,
#   audit-content kører FØR commit og standser jobbet ved fejl.
#
# Stoppes: Actions → "YouTube Auto Update" → "Disable workflow" (så afviser GitHub også starterens kald).

on:
  # 15/10-2026: startes hver time på minut 17 af Cloudflare-Workeren "tfw-starter"
  # (cloudflare/starter/), ikke af GitHubs tidsplan — den startede kun 4-5 af 24 kørsler.
  # Målt: kørsel #669 startet af starteren kl. 11:17:03. Den gamle linje er slået fra,
  # så robotten ikke kører to gange:
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Fælles kø (14/10): robotten, omskrivningen og AI-billedkørslen skriver alle til sitet. Kører de
# samtidig, kan den ene ikke gemme (push afvises). Med samme gruppe venter de på hinanden.
concurrency:
  group: site-skriver
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      # ref: main (7/11-2026, kø-fejlen - som techmediaarch 4/11): uden den henter GitHub main, som den så ud, da
      # kørslen blev BESTILT. En kørsel i kø bag en anden ville starte fra en gammel udgave og lave arbejdet igen.
      - uses: actions/checkout@v5
        with:
          ref: main

      # Jacobs hjerne (trin 4 af robot-koblingen, 21/10): stemme/holdninger fra det
      # PRIVATE repo jacob-hjerne, hentet med læsenøglen HJERNE_NOEGLE til mappen
      # _hjerne (står i .gitignore). continue-on-error: mangler nøglen eller
      # repoet, skrives INGEN artikel (25/10, Jacob: hjernen skal altid bruges).
      - name: Hent hjernen (jacob-hjerne, privat, kun læsning)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: jacobolsenjso-cloud/jacob-hjerne
          ssh-key: ${{ secrets.HJERNE_NOEGLE }}
          path: _hjerne

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      # Selvtest af skrivereglerne (fase 2, 6/10-2026). Den kan fejle — og gør
      # den det, er en regel gået i stykker, og så skal robotten ikke skrive.
      - name: Selvtest af skrivereglerne
        # 13/11-2026: også noindex-reglen for gamle artikler (ingen Google-vist artikel må få noindex)
        run: node test-skriveregler.mjs && node test-noindex-gamle.mjs

      # Outputtet gemmes også i en fil til robottens logbog (14/10). pipefail: uden den ville tee
      # skjule, hvis robotten fejlede, og kørslen blive grøn.
      - name: Kør YouTube Robot
        run: |
          set -o pipefail
          node auto-youtube.mjs 2>&1 | tee "$RUNNER_TEMP/robot.log"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Søgetal til valget af spørgsmål (10/11-2026, src/lib/dataforseo.mjs). Mangler de, vælges der som før.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}

      # Robottens logbog (14/10): én linje pr. kørsel i src/data/robot-log.jsonl (pris, udfald,
      # advarsler). Den daglige rapport læser den. Slutter altid med kode 0.
      - name: Skriv i robottens logbog
        run: node robot-log.mjs "$RUNNER_TEMP/robot.log"

      # Retter linktekster, der citerer en overskrift, sitet ikke har mere.
      # Ændrer man en titel, bliver alle citater af den gamle titel et brudt
      # løfte — linket virker, men teksten lover noget andet. Målt 22/9-2026:
      # 129 sådanne links, samlet op gennem tre omgange titelrettelser.
      #
      # Trinnet RETTER i stedet for at standse, fordi der kun findes ét rigtigt
      # svar: målsidens nuværende overskrift. Scriptet slutter altid med kode 0
      # og kan derfor aldrig gøre kørslen rød. Ændringerne kommer med i
      # commit'et nedenfor (git add .), så de kan ses og rulles tilbage.
      - name: Ret forældede linktekster
        run: node ret-linktekster.mjs --skriv --resultat="$RUNNER_TEMP/ret-linktekster.json"

      # Robottens eget bevis: public/robot-status.json. Skrives kun, når der er
      # sket noget (ny artikel, rettede linktekster, en advarsel), og ligger
      # bagefter både i git og på techfeedwatch.com/robot-status.json — så det
      # kan læses uden pc, browser eller GitHub-nøgle. Slutter altid med kode 0.
      - name: Skriv robot-status
        run: node robot-status.mjs --resultat="$RUNNER_TEMP/ret-linktekster.json"

      # Kigger arkivet efter tomme artikler, manglende resuméer, manglende
      # kildeangivelse og spor fra modellen. Kører FØR commit, så en artikel
      # med et hul aldrig når at blive udgivet.
      #
      # Baggrund: 25 artikler blev udgivet helt uden brødtekst og lå der i tre
      # uger, fordi intet sagde fra. Scriptet afslutter med kode 1 ved fejl, og
      # så standser jobbet her i stedet for at pushe.
      - name: Tjek indholdet
        run: node audit-content.mjs

      # Interne links: peger de på noget, der findes? audit-links.mjs tjekker kun
      # EKSTERNE links, så intet fangede det, når en artikel blev fjernet, mens
      # andre sider stadig linkede til den. Målt 20/9-2026: to artikler linkede
      # til en side, prune havde slettet — begge gav 404 for læseren. Stopper
      # jobbet ved fund, ligesom tjekket ovenfor.
      #
      # Scriptet har også en regel 2 (lover linkteksten den rigtige overskrift?),
      # men DEN stopper ikke kørslen — den skriver kun tallet i loggen, fordi
      # trinnet ovenfor allerede har rettet det, der kan rettes maskinelt.
      - name: Tjek interne links
        run: node audit-interne-links.mjs

      # Sidste tjek sker på det FÆRDIGE site, ikke på kilden. De to tjek
      # ovenfor læser markdown og kan derfor ikke se, om schema kan parses,
      # om canonical passer, eller om en 301 peger videre til endnu en 301.
      # Dobbelttjekket 20/9-2026 fandt 40 sådanne kæder, som ingen af de
      # eksisterende tjek kunne opdage. Buildet tager ~17 sekunder.
      - name: Byg sitet
        run: npm run build

      - name: Tjek det færdige site
        run: node audit-site.mjs

      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 9/11-2026: commit via .github/commit.sh - en kørsel, der kun skrev i robottens logbog, får
          # [CF-Pages-Skip], så Cloudflare ikke bygger sitet forgæves (målt: 78 % af robottens commits).
          # Kode: 0 = committet, 1 = intet at gemme, andet = fejl (kørslen bliver rød).
          KODE=0; bash .github/commit.sh "Automatisk tilføjet ny video" || KODE=$?
          if [ "$KODE" -gt 1 ]; then exit "$KODE"; fi
          if [ "$KODE" -eq 0 ]; then
            # Andre kan have pushet, mens robotten kørte (op til en time).
            # Målt 15/9: kørsel #522 skrev en artikel, men push blev afvist og
            # fejlen skjult af "|| echo" — artiklen gik tabt med et grønt flueben.
            # Nu: hent og læg vores commit ovenpå; fejler push alligevel, skal
            # kørslen blive RØD, så det bliver set.
            # 7/11-2026: fælles udgivelse - 3 forsøg, datafiler flettes, konflikt i alt andet stopper (.github/udgiv.sh).
            bash .github/udgiv.sh
          else
            echo "Ingen nye videoer fundet."
          fi

      # Gemini-stop (8/10): kreditter brugt op / ugyldig nøgle / dagsloft. Robotten skriver
      # _gemini-stop.txt; her bliver kørslen RØD (= mail), efter at alt andet er gemt.
      - name: Meld hvis Gemini er stoppet
        if: always()
        run: |
          if [ -f _gemini-stop.txt ]; then cat _gemini-stop.txt; exit 1; fi
          echo "Gemini svarede normalt."
