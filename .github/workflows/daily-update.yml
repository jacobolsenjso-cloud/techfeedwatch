name: YouTube Auto Update

# STOPPET 12. august 2026 efter fjerde AdSense-afslag: "indhold med ringe værdi".
#
# Sitet havde 391 maskinskrevne referater af andres videoer mod ca. 95 originale
# sider (guides, glossar, værktøjer) — fire til én i den forkerte retning. Hver
# ny artikel i den gamle form gjorde forholdet værre mens vi ventede på svar.
#
# Robotten skal først køre igen når artiklerne handler om EMNET frem for om
# videoen: søgespørgsmålet fra autocomplete bliver artiklens opgave, og videoen
# bliver understøttende materiale med kreditering — ikke referatets genstand.
#
# Sådan startes den igen: fjern # foran de to schedule-linjer nedenfor.
# Indtil da kan den stadig køres i hånden fra Actions-fanen (workflow_dispatch),
# så vi kan teste ændringer uden at udgive løbende.

on:
  # schedule:
  #   - cron: "0 */2 * * *" # Kører præcis hver anden time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      - name: Kør YouTube Robot
        run: node auto-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Kigger arkivet efter tomme artikler, manglende resuméer, manglende
      # kildeangivelse og spor fra modellen. Kører FØR commit, så en artikel
      # med et hul aldrig når at blive udgivet.
      #
      # Baggrund: 25 artikler blev udgivet helt uden brødtekst og lå der i tre
      # uger, fordi intet sagde fra. Scriptet afslutter med kode 1 ved fejl, og
      # så standser jobbet her i stedet for at pushe.
      - name: Tjek indholdet
        run: node audit-content.mjs

      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Automatisk tilføjet ny video" || echo "Ingen nye videoer fundet."
          git push || echo "Intet nyt at uploade."
