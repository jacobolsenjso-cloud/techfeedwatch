name: Omskriv gamle artikler

# 14/10-2026 (Jacob): de gamle artikler skrives om med robottens opskrift (omskriv-gamle.mjs).
# 25/10 (Jacob: "én opskrift til alle artikler"): 2 om dagen, de Google har vist først, så nyeste.
# Hver omskrivning genbruger artiklens AI-billede eller laver ét, hvis den ikke har et.
# Målt 25/10 (opskrift 3, fejlforsøg medregnet): ca. 4,40 kr. pr. færdig artikel.
# Samme kørsel: daglig stikprøve (stikproeve.mjs) og faktatjek af dem, der venter (faktatjek-gamle.mjs).
# Resultat og målt pris pr. kørsel: src/data/omskriv-log.json, faktatjek-log.json, stikproeve-log.json.
# Stoppes: Actions → "Omskriv gamle artikler" → "Disable workflow" (så afviser GitHub også starterens kald).

on:
  # 15/10-2026: startes kl. 06:37 UTC af Cloudflare-Workeren "tfw-starter" (cloudflare/starter/).
  # GitHubs tidsplan startede den ikke 15/10. Slået fra, så den ikke kører to gange:
  # schedule:
  #   - cron: "37 6 * * *"   # 08:37 dansk sommertid (UTC+2)
  workflow_dispatch:
    inputs:
      antal:
        description: "Antal artikler i denne kørsel"
        # 25/10 (Jacob): 2 om dagen (før 3, kortvarigt 5) - prisen med slutkontrol
        default: "2"
      # 24/10: målret én bestemt artikel (fx dårlig video opdaget efter udgivelse).
      # kun = artiklens slug; nyvideo = YouTube-URL der skal erstatte den gamle video.
      kun:
        description: "Kun denne artikel (slug) - valgfri"
        default: ""
      nyvideo:
        description: "Ny video-URL til artiklen - valgfri"
        default: ""
      # 25/10 (Jacob: "bland"): artikler, Google ikke har vist, skrives ikke om, men faktatjekkes
      # (faktatjek-gamle.mjs, ca. 0,45 kr pr. artikel). 0 = spring faktatjekket over.
      tjek:
        description: "Antal gamle artikler der kun faktatjekkes"
        default: "10"

permissions:
  contents: write

# Samme kø som robotten og AI-billedkørslen: aldrig to, der skriver til sitet samtidig.
concurrency:
  group: site-skriver
  cancel-in-progress: false

jobs:
  omskriv:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # 23/10: omskrivningen kører gennem add-video.mjs og skal have hjernen med,
      # præcis som den daglige robot — ellers omskrives gamle artikler UDEN Jacobs
      # stemme. continue-on-error: hjernen er valgfri og må aldrig vælte en kørsel.
      - name: Hent hjernen (jacob-hjerne, privat, kun læsning)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: jacobolsenjso-cloud/jacob-hjerne
          ssh-key: ${{ secrets.HJERNE_NOEGLE }}
          path: _hjerne

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      - name: Omskriv gamle artikler
        run: node omskriv-gamle.mjs --antal=${{ github.event.inputs.antal || '2' }} "--kun=${{ github.event.inputs.kun || '' }}" "--nyvideo=${{ github.event.inputs.nyvideo || '' }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 25/10 (Jacob: "en uafhængig stikprøve hver dag"): 2 tilfældige, allerede kontrollerede
      # artikler; koden henter kildesiderne og tjekker tallene. Fund kontrolleres i trinnet herunder.
      # continue-on-error: en stikprøve må aldrig stoppe omskrivningerne.
      - name: Daglig stikprøve
        continue-on-error: true
        run: node stikproeve.mjs --antal=2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Faktatjek gamle artikler (uden omskrivning)
        run: node faktatjek-gamle.mjs --antal=${{ github.event.inputs.tjek || '10' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Samme kvalitetsvagt som robotten: fejl her standser jobbet, før noget gemmes.
      - name: Tjek indholdet
        run: node audit-content.mjs

      - name: Gem omskrivningerne (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/videos public/billeder public/kort public/og src/data/omskriv-fejl.json src/data/omskriv-log.json src/data/faktatjek-log.json src/data/omskriv-prioritet.json src/data/stikproeve-log.json src/data/stikproeve-fund.json
          if git commit -m "Archive articles rewritten with the search-first recipe"; then
            git pull --rebase origin main
            git push
          else
            echo "Ingen omskrivninger."
          fi
