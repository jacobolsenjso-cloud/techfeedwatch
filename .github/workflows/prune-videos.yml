name: Prune Deleted Videos

on:
  # SLÅET FRA 20/9-2026 af Jacob. Hvorfor: prune SLETTER artikler, men skriver
  # ingen 301'er — i modsætning til slet-artikler.mjs, der gør det (linje 67-68).
  # Målt 20/9: 38 gamle adresser sendte allerede Google videre til en 404, fordi
  # prune havde fjernet to artikler, som tidligere 301'er pegede på. Hver kørsel
  # kan lave nye huller, og næste var 22/9 kl. 04:00 UTC.
  # Slås til igen, når prune selv laver 301'er (eller når beslutning A er bygget).
  # Genstart: fjern # foran de to linjer nedenfor.
  # schedule:
  #   - cron: "0 4 */3 * *" # Ca. hver 3. dag kl. 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      - name: Scan og fjern døde videoer
        run: node prune-deleted-videos.mjs --apply
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Kører EFTER oprydningen, så vi ikke bruger kvote på videoer der lige er
      # blevet slettet. 367 artikler koster 8 kald, fordi YouTube tager 50 id'er
      # ad gangen. Tallene vises på /popular med den dato de blev hentet.
      - name: Opfrisk visningstal
        run: node update-view-counts.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Gemmer månedens optælling til /trends. Scriptet skriver kun hvis
      # månedens punkt mangler, så det er ligegyldigt at jobbet kører hver
      # tredje dag — der bliver ét punkt pr. måned uanset hvad.
      - name: Gem månedens trend-optælling
        run: node snapshot-trends.mjs

      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Prune dead videos, refresh source view counts, store trend snapshot" || echo "Ingen ændringer."
          git push || echo "Intet nyt at uploade."
