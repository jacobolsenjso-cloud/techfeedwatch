name: Prune Deleted Videos

on:
  schedule:
    - cron: "0 4 */3 * *" # Ca. hver 3. dag kl. 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer dependencies
        run: npm install

      - name: Scan og fjern døde videoer
        run: node prune-deleted-videos.mjs --apply
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Gem ændringer (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Automatisk fjernet døde videoer" || echo "Ingen døde videoer at fjerne."
          git push || echo "Intet nyt at uploade."
